name: Release

# Push a tag like v0.2.0 (matching package.json "version") to publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --ignore-scripts
      - run: npm run release:check
      - run: npm run lint && npm run typecheck && npm run test:unit
      - run: npx vsce package --no-dependencies --out w3c-validator-plus-${{ github.ref_name }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"

  marketplace:
    name: Publish to VS Code Marketplace
    needs: build
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      id-token: write # GitHub OIDC token for Microsoft Entra ID: no stored PAT
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: npx --yes @vscode/vsce publish --packagePath *.vsix --azure-credential

  openvsx:
    name: Publish to Open VSX
    needs: build
    runs-on: ubuntu-latest
    environment: openvsx
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - run: npx --yes ovsx publish *.vsix --pat "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  github-release:
    name: GitHub release
    needs: [marketplace, openvsx]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - run: gh release create "$GITHUB_REF_NAME" *.vsix --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
